  const [time, setTime] = useState(provider.availability[availableDateIds[0]][0]);
  const [asap, setAsap] = useState(false);
  const [description, setDescription] = useState("");
  const [photos, setPhotos] = useState(0);

  const timesForDate = provider.availability[dateId] || [];

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <TopBar title="Programa tu visita" onBack={onBack} />

            <p style={{ fontSize: 13, fontWeight: 600, color: INK }}>{provider.name}</p>
            <p style={{ fontSize: 11, color: "#6B7A75" }}>{category.label} · disponibilidad de este prestador</p>
          </div>
        </div>

        <button onClick={() => setAsap(true)}
          style={{
            display: "flex", alignItems: "center", gap: 10, borderRadius: 16, padding: 14, marginBottom: 16,
            backgroundColor: asap ? INK : "#fff", textAlign: "left"
          }}>
          <div style={{ width: 34, height: 34, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: asap ? "rgba(255,255,255,0.15)" : "#EFE2D2" }}>
            <IconClock size={16} color={asap ? "#fff" : AMBER} />
          </div>
          <div>
            <p style={{ fontSize: 13.5, fontWeight: 600, color: asap ? "#fff" : INK }}>Lo antes posible</p>
            <p style={{ fontSize: 11, color: asap ? "rgba(255,255,255,0.7)" : "#6B7A75" }}>Llega en {provider.eta} aprox.</p>
          </div>
        </button>

        <p style={{ fontSize: 12, fontWeight: 600, color: INK, marginBottom: 10 }}>O elige un horario disponible</p>

          {DATES.filter((d) => availableDateIds.includes(d.id)).map((d) => (
            <button key={d.id} onClick={() => { setDateId(d.id); setAsap(false); setTime(provider.availability[d.id][0]); }}
              style={{
                flex: 1, borderRadius: 14, padding: "10px 0", textAlign: "center",
                backgroundColor: !asap && dateId === d.id ? AMBER : "#fff"
              }}>
              <p style={{ fontSize: 12, fontWeight: 700, color: !asap && dateId === d.id ? "#fff" : INK }}>{d.label}</p>
              <p style={{ fontSize: 10, color: !asap && dateId === d.id ? "rgba(255,255,255,0.85)" : "#8C9591" }}>{d.sub}</p>
            </button>
          ))}
        </div>

        {timesForDate.length === 0 ? (
          <p style={{ fontSize: 12, color: "#8C9591", textAlign: "center", marginBottom: 16 }}>
            {provider.name.split(" ")[0]} no tiene horarios este día.
          </p>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 8 }}>
            {timesForDate.map((t) => (
              <button key={t} onClick={() => { setTime(t); setAsap(false); }}
                style={{
                  borderRadius: 12, padding: "10px 0", textAlign: "center", fontSize: 12, fontWeight: 600,
                  backgroundColor: !asap && time === t ? AMBER : "#fff",
                  color: !asap && time === t ? "#fff" : INK
                }}>
                {t}
              </button>
            ))}

function ScreenSearchResults({ query, onBack, onSelectProvider }) {
  const q = query.toLowerCase();
  const matchedCategories = CATEGORIES.filter((c) => c.label.toLowerCase().includes(q));
  const matchedCategoryIds = matchedCategories.map((c) => c.id);

  const results = PROVIDERS.map((p) => {
    const matchedCatTags = p.categories
      .filter((id) => matchedCategoryIds.includes(id))
      .map((id) => CATEGORIES.find((c) => c.id === id)?.label)
      .filter(Boolean);
    const matchedServices = p.services.filter((s) => s.label.toLowerCase().includes(q));
    const serviceTags = matchedServices.map((s) => s.label);
    const tags = [...new Set([...matchedCatTags, ...serviceTags])];
    if (tags.length === 0) return null;
    const resolvedCategoryId = p.categories.find((id) => matchedCategoryIds.includes(id))
      || (matchedServices[0] && matchedServices[0].category);
    return { provider: p, tags, category: CATEGORIES.find((c) => c.id === resolvedCategoryId) };
  }).filter(Boolean);

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto" }}>
      <TopBar title="Resultados" onBack={onBack} />
      <div style={{ padding: "0 20px 16px" }}>
        <p style={{ fontSize: 12, color: "#6B7A75" }}>
          {results.length > 0
            ? <>Resultados para "<strong style={{ color: INK }}>{query}</strong>"</>
            : <>Sin resultados para "<strong style={{ color: INK }}>{query}</strong>"</>}
        </p>
      </div>

      {results.length === 0 ? (
        <div style={{ padding: "0 20px", display: "flex", flexDirection: "column", alignItems: "center", marginTop: 24 }}>
          <div style={{ width: 56, height: 56, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "#fff", marginBottom: 14 }}>

function ScreenBroadcast({ category, filters, onBack, onSelectProvider, onViewDetail }) {
  const [status, setStatus] = useState("buscando"); // buscando | encontrado | sinresultados

  const findMatch = () => {
    const candidates = PROVIDERS.filter((p) => {
      if (!p.categories.includes(category.id)) return false;
      if (filters.rating !== "any" && p.rating < parseFloat(filters.rating)) return false;
      if (filters.schedule !== "any" && !Object.keys(p.availability).includes(filters.schedule)) return false;
      const catServices = p.services.filter((s) => s.category === category.id);
      if (filters.budget !== "any") {
        const maxBudget = parseInt(filters.budget, 10);
        const hasAffordable = catServices.some((s) => parseInt(s.price.replace("$", ""), 10) <= maxBudget);
        if (!hasAffordable) return false;
      }
      return true;
    });
    if (candidates.length === 0) return null;
    const provider = candidates[0];
    const catServices = provider.services.filter((s) => s.category === category.id);
    let service = catServices[0];
    if (filters.budget !== "any") {
      const maxBudget = parseInt(filters.budget, 10);
      service = catServices.find((s) => parseInt(s.price.replace("$", ""), 10) <= maxBudget) || service;
    }
    return { provider, service };
  };

  const [match, setMatch] = useState(null);

  useEffect(() => {
    const t = setTimeout(() => {
      const result = findMatch();
      setMatch(result);
      setStatus(result ? "encontrado" : "sinresultados");
    }, 2600);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <TopBar title="Búsqueda personalizada" onBack={onBack} />
      <div style={{ padding: "0 20px", flex: 1, display: "flex", flexDirection: "column" }}>

        {status === "buscando" && (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <div style={{ position: "relative", width: 96, height: 96, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 20 }}>
              <div className="pulse" style={{ position: "absolute", inset: 0, borderRadius: 999, backgroundColor: "#EFE2D2" }} />
              <div style={{ width: 60, height: 60, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: INK }}>
                <IconRadar size={26} color={AMBER} />
              </div>
            </div>
            <p style={{ fontSize: 15, fontWeight: 700, color: INK, marginBottom: 4, textAlign: "center" }}>
              Buscando prestadores de {category.label}...
            </p>
            <p style={{ fontSize: 12, color: "#6B7A75", textAlign: "center", maxWidth: 220, lineHeight: 1.5 }}>
              Aplicando tus filtros de presupuesto, calificación y horario.
            </p>
          </div>
        )}

        {status === "encontrado" && match && (
          <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column" }}>
            <div style={{ textAlign: "center", padding: "20px 0 8px" }}>
              <div style={{ width: 40, height: 40, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "#E3F0E8", margin: "0 auto 10px" }}>
                <IconCheck size={20} color={GREEN} />
              </div>
              <p style={{ fontSize: 14, fontWeight: 700, color: INK }}>¡Encontramos un prestador para ti!</p>
              <p style={{ fontSize: 11, color: "#6B7A75", marginTop: 3 }}>Según los filtros que elegiste</p>
            </div>

            <div style={{ borderRadius: 18, padding: 16, backgroundColor: "#fff", marginTop: 16, marginBottom: 16 }}>
              <button onClick={() => onViewDetail(match.provider)}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, marginBottom: 10, textAlign: "left" }}>
                <div style={{ width: 48, height: 48, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, color: "#fff", backgroundColor: INK, flexShrink: 0 }}>

function ScreenTracking({ provider, service, when, onBack, onFinish }) {
  const [step, setStep] = useState(1);

  useEffect(() => {
    if (step < STATUS_STEPS.length - 1) {
      const t = setTimeout(() => setStep((s) => s + 1), 5000);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => onFinish(), 5000);
    return () => clearTimeout(t);
  }, [step]);

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>

function ScreenSetQuote({ request, onBack, onContinue }) {
  const basePrice = parseInt(String(request.price).replace(/[^0-9]/g, ""), 10) || 0;
  const minPrice = Math.round(basePrice * 0.85);
  const maxPrice = Math.round(basePrice * 1.15);
  const [amount, setAmount] = useState(String(basePrice));

  const amountNum = parseInt(amount, 10) || 0;
  const inRange = amountNum >= minPrice && amountNum <= maxPrice;

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <TopBar title="Cobro del servicio" onBack={onBack} />
      <div style={{ padding: "0 20px", flex: 1, minHeight: 0, overflowY: "auto" }}>
        <div style={{ borderRadius: 16, padding: 16, backgroundColor: "#fff", marginBottom: 16 }}>
          <p style={{ fontSize: 11.5, fontWeight: 600, color: "#8C9591", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Solicitud</p>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "6px 0" }}>
            <span style={{ color: "#6B7A75" }}>Servicio</span>
            <span style={{ fontWeight: 600, color: INK }}>{request.service}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "6px 0" }}>
            <span style={{ color: "#6B7A75" }}>Cliente</span>
            <span style={{ fontWeight: 500, color: INK }}>{request.client}</span>
          </div>
        </div>

        <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>Presupuesto configurado para este servicio</p>
        <p style={{ fontSize: 12.5, color: "#6B7A75", marginBottom: 16 }}>de ${minPrice} a ${maxPrice}</p>

        <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>¿Cuánto vas a cobrar por este servicio?</p>
        <div style={{
          display: "flex", alignItems: "center", gap: 8, borderRadius: 14, padding: "12px 14px", backgroundColor: "#fff", marginBottom: 8,
          border: !inRange && amount ? `1.5px solid ${RED}` : "1.5px solid transparent"
        }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: !inRange && amount ? RED : INK }}>$</span>
          <input
            value={amount} inputMode="numeric"
            onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ""))}
            placeholder="0"
            style={{ flex: 1, minWidth: 0, border: "none", outline: "none", fontSize: 14, fontWeight: 700, color: !inRange && amount ? RED : INK, backgroundColor: "transparent" }} />
        </div>
        {!inRange && amount && (
          <p style={{ fontSize: 11, color: RED, marginBottom: 12 }}>
            El cobro debe estar dentro de tu presupuesto configurado (${minPrice} - ${maxPrice}).
          </p>
        )}
      </div>

      <div style={{ padding: "12px 20px 20px" }}>
        <button
          disabled={!inRange}
          onClick={() => onContinue(`$${amountNum}`)}
          style={{ width: "100%", padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: inRange ? AMBER : "#D8D0BF" }}>
          Continuar
        </button>
      </div>
    </div>
  );
}

function ProviderApp({ onSwitchToClient, onLogout }) {
  const [tab, setTab] = useState("panel");
  const [online, setOnline] = useState(false);
  const [requests, setRequests] = useState(PENDING_REQUESTS);
  const [acceptedRequests, setAcceptedRequests] = useState([]);
  const [viewingRequest, setViewingRequest] = useState(null);
  const [viewingClient, setViewingClient] = useState(null);
  const [quotingRequest, setQuotingRequest] = useState(null);
  const [quoteStage, setQuoteStage] = useState("amount"); // amount | sent
  const [jobActive, setJobActive] = useState(false);
  const [activeRequest, setActiveRequest] = useState(null);
  const [jobStep, setJobStep] = useState(0);
  const [jobArrived, setJobArrived] = useState(false);
  const [jobEvidence, setJobEvidence] = useState(0);

  const openRequest = (r) => setViewingRequest(r);
  const closeRequestDetail = () => setViewingRequest(null);
  const openClientProfile = (r) => setViewingClient(r);
  const closeClientProfile = () => setViewingClient(null);

  const startAccept = () => {
    setQuotingRequest(viewingRequest);
    setQuoteStage("amount");
    setViewingRequest(null);
  };
  const confirmQuote = (amount) => {
    setRequests((rs) => rs.filter((r) => r.id !== quotingRequest.id));
    setAcceptedRequests((rs) => [...rs, { ...quotingRequest, price: amount }]);
    setQuoteStage("sent");
  };
  const finishQuoteFlow = () => {
    setQuotingRequest(null);
    setTab("panel");
  };
  const rejectRequest = () => {
    setRequests((rs) => rs.filter((r) => r.id !== viewingRequest.id));
    setViewingRequest(null);
  };
  const startVisit = (r) => {
    setAcceptedRequests((rs) => rs.filter((x) => x.id !== r.id));
    setActiveRequest(r);
    setJobActive(true);
    setJobStep(0);
    setJobArrived(false);
    setJobEvidence(0);
  };
  const pauseJob = () => { setJobActive(false); setTab("panel"); };
  const resumeJob = () => setJobActive(true);
  const finishJob = () => { setJobActive(false); setActiveRequest(null); setJobStep(0); setJobArrived(false); setJobEvidence(0); };

  const handleTabChange = (t) => {
    setViewingRequest(null);
    setViewingClient(null);
    setTab(t);
  };

  let content;
  if (jobActive) {
    content = (
      <ProviderJob request={activeRequest} onBack={pauseJob} onNext={finishJob}
        step={jobStep} setStep={setJobStep}
        arrived={jobArrived} setArrived={setJobArrived}
        evidence={jobEvidence} setEvidence={setJobEvidence} />
    );
  } else if (quotingRequest) {
    content = quoteStage === "amount"
      ? <ScreenSetQuote request={quotingRequest} onBack={() => { setQuotingRequest(null); }} onContinue={confirmQuote} />
      : <ScreenQuoteSent onDone={finishQuoteFlow} />;
  } else if (viewingClient) {
    content = <ScreenClientDetail client={viewingClient} onBack={closeClientProfile} />;
  } else if (viewingRequest) {
    content = <ScreenRequestDetail request={viewingRequest} onBack={closeRequestDetail} onAccept={startAccept} onReject={rejectRequest} onViewClient={openClientProfile} />;
  } else if (tab === "panel") {
    content = (
      <ProviderHome online={online} setOnline={setOnline} requests={requests} acceptedRequests={acceptedRequests}
        onOpenRequest={openRequest} onStartVisit={startVisit}
        inProgressRequest={activeRequest} onResumeVisit={resumeJob} />
    );
  } else if (tab === "historial") {
    content = <ProviderHistory onBack={() => setTab("panel")} />;
  } else {
    content = <ProviderProfile onLogout={onLogout} />;
  }

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ flex: 1, minHeight: 0, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        {content}
      </div>
      <ProviderTabs tab={tab} setTab={handleTabChange} />
    </div>
  );
}

function ClientApp({ onLogout }) {
  const [screen, setScreenRaw] = useState("home");
  const [historyStack, setHistoryStack] = useState([]);
  const [category, setCategory] = useState(null);
  const [provider, setProvider] = useState(null);
  const [service, setService] = useState(null);
  const [when, setWhen] = useState(null);
  const [description, setDescription] = useState("");
  const [photos, setPhotos] = useState(0);
  const [searchQuery, setSearchQuery] = useState("");
  const [filters, setFilters] = useState({ budget: "any", rating: "any", schedule: "any" });
  const [activeService, setActiveService] = useState(null);

  // navigate forward: remembers where we came from
  const navigate = (next) => {
    setHistoryStack((h) => [...h, screen]);
    setScreenRaw(next);
  };
  // go back: always returns to whichever screen was actually visited before,
  // no matter which section the user is currently in
  const goBack = () => {
    setHistoryStack((h) => {
      if (h.length === 0) { setScreenRaw("home"); return h; }
      const copy = [...h];
      const prev = copy.pop();
      setScreenRaw(prev);
      return copy;
    });
  };
  // jump: used by the bottom tab bar — an independent destination, not part of the back chain
  const jumpTo = (next) => { setHistoryStack([]); setScreenRaw(next); };

  const resetToHome = () => {
    setHistoryStack([]); setScreenRaw("home"); setCategory(null); setProvider(null); setService(null);
    setWhen(null); setDescription(""); setPhotos(0); setSearchQuery("");
    setFilters({ budget: "any", rating: "any", schedule: "any" });
  };

  const completeRequestAndGoHome = () => {
    setActiveService({ provider, service, category, when, status: "Confirmado" });
    resetToHome();
  };

  const openActiveService = () => {
    if (!activeService) return;
    setProvider(activeService.provider);
    setService(activeService.service);
    setCategory(activeService.category);
    setWhen(activeService.when);
    navigate("tracking");
  };

  const finishRatingAndGoHome = () => {
    setActiveService(null);
    resetToHome();
  };

  const activeTab = screen === "activos" ? "activos" : screen === "perfil" ? "perfil" : "inicio";

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, overflow: "hidden" }}>
        {screen === "home" && (
          <ScreenHome onPick={(c) => { setCategory(c); navigate("providers"); }}
            onViewActive={openActiveService}
            onSearch={(q) => { setSearchQuery(q); navigate("searchResults"); }}
            onOpenCategories={() => navigate("categories")}
            active={activeService} />
        )}
        {screen === "categories" && (
          <ScreenCategoriesList onBack={goBack}
            onPick={(c) => { setCategory(c); navigate("providers"); }} />
        )}
        {screen === "searchResults" && (
          <ScreenSearchResults query={searchQuery} onBack={goBack}
            onSelectProvider={(p, c) => { setProvider(p); setCategory(c); navigate("providerProfile"); }} />
        )}
        {screen === "providers" && (
          <ScreenProviders category={category} onBack={goBack}
            onSelect={(p) => { setProvider(p); navigate("providerProfile"); }}
            onBroadcast={() => navigate("customFilters")} />
        )}
        {screen === "customFilters" && (
          <ScreenCustomFilters category={category} onBack={goBack}
            onStartSearch={(f) => { setFilters(f); navigate("broadcast"); }} />
        )}
        {screen === "broadcast" && (
          <ScreenBroadcast category={category} filters={filters} onBack={goBack}
            onSelectProvider={(p) => { setProvider(p); navigate("providerProfile"); }}
            onViewDetail={(p) => { setProvider(p); navigate("providerDetail"); }} />
        )}
        {screen === "providerProfile" && (
          <ScreenProviderProfile provider={provider} category={category} onBack={goBack}
            onSelectService={(s) => { setService(s); navigate("datetime"); }}
            onOpenDetail={() => navigate("providerDetail")} />
        )}
        {screen === "providerDetail" && (
          <ScreenProviderDetail provider={provider} onBack={goBack} />
        )}
        {screen === "datetime" && (
          <ScreenDateTime category={category} provider={provider} onBack={goBack}
            onNext={(w, d, p) => { setWhen(w); setDescription(d); setPhotos(p); navigate("confirm"); }} />
        )}
        {screen === "confirm" && (
          <ScreenConfirm provider={provider} category={category} service={service} when={when} description={description} photos={photos}
            onBack={goBack} onConfirm={() => navigate("payment")} />
        )}
        {screen === "payment" && (
          <ScreenPayment provider={provider} service={service} onBack={goBack}
            onNext={() => navigate("requestSent")} />
        )}
        {screen === "requestSent" && (
          <ScreenRequestSent provider={provider} service={service} when={when}
            onCancel={resetToHome} onConfirmed={completeRequestAndGoHome} />
        )}
        {screen === "tracking" && (
          <ScreenTracking provider={provider} service={service} when={when} onBack={goBack} onFinish={() => navigate("rating")} />
        )}
        {screen === "rating" && (
          <ScreenRating provider={provider} service={service} onBack={goBack} onDone={finishRatingAndGoHome} />
        )}
        {screen === "activos" && (
          <ClientActiveServices onOpenTracking={() => {
            setProvider(PROVIDERS[0]); setService(PROVIDERS[0].services[0]); setWhen(CLIENT_ACTIVE_SERVICES[0].when); navigate("tracking");
          }} />
        )}
        {screen === "perfil" && <ClientProfile onLogout={onLogout} />}
      </div>
      <ClientTabs
        tab={activeTab}
        setTab={(t) => {
          if (t === "inicio") resetToHome();
          else jumpTo(t);
        }}
      />
    </div>
  );
}

function ScreenForgotPassword({ onBack, onReset }) {
  const [stage, setStage] = useState("identify"); // identify | reset | done
  const [username, setUsername] = useState("");
  const [code, setCode] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [resetError, setResetError] = useState("");

  const canSendCode = username.trim() !== "";
  const newPasswordValid = /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(newPassword);
  const newPasswordsMatch = newPassword !== "" && newPassword === confirmPassword;
  const canReset = code.trim() !== "" && newPasswordValid && newPasswordsMatch;

  const handleConfirmReset = () => {
    const ok = onReset(username, newPassword);
    if (ok) { setResetError(""); setStage("done"); }
    else setResetError("No encontramos esa cuenta de usuario.");
  };

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <TopBar title="Restablecer contraseña" onBack={onBack} />
      <div style={{ padding: "0 20px", flex: 1, minHeight: 0, overflowY: "auto" }}>

        {stage === "identify" && (
          <>
            <p style={{ fontSize: 12.5, color: "#6B7A75", lineHeight: 1.5, marginBottom: 20 }}>
              Escribe tu usuario y te enviaremos un código para restablecer tu contraseña.
            </p>
            <AuthField label="Usuario" Icon={IconUser} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="tu_usuario" />
          </>
        )}

        {stage === "reset" && (
          <>
            <p style={{ fontSize: 12.5, color: "#6B7A75", lineHeight: 1.5, marginBottom: 20 }}>
              Ingresa el código que enviamos y elige tu nueva contraseña.
            </p>
            <AuthField label="Código de verificación" Icon={IconShield} value={code} onChange={(e) => setCode(e.target.value)} placeholder="Código de 6 dígitos" />
            <AuthField label="Nueva contraseña" Icon={IconLock} type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)}
              placeholder="••••••••" invalid={newPassword !== "" && !newPasswordValid} />
            <AuthField label="Confirmar contraseña" Icon={IconLock} type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)}
              placeholder="••••••••" invalid={confirmPassword !== "" && !newPasswordsMatch} />
            <p style={{
              fontSize: 10.5, lineHeight: 1.5, marginBottom: 8,
              fontWeight: (newPassword && !newPasswordValid) || (confirmPassword && !newPasswordsMatch) ? 700 : 400,
              color: (newPassword && !newPasswordValid) || (confirmPassword && !newPasswordsMatch) ? RED : "#8C9591"
            }}>
              {confirmPassword && !newPasswordsMatch
                ? "Las contraseñas no coinciden."
                : "Debe tener mínimo 8 caracteres, 1 mayúscula, 1 número y 1 signo."}
            </p>
            {resetError && (
              <p style={{ fontSize: 11.5, color: RED, marginBottom: 8 }}>{resetError}</p>
            )}
          </>
        )}

        {stage === "done" && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 30 }}>
            <div style={{ width: 52, height: 52, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "#E3F0E8", marginBottom: 16 }}>
              <IconCheck size={22} color={GREEN} />
            </div>
            <p style={{ fontSize: 15, fontWeight: 700, color: INK, marginBottom: 6 }}>Contraseña actualizada</p>
            <p style={{ fontSize: 12.5, color: "#6B7A75", textAlign: "center", maxWidth: 240, lineHeight: 1.5 }}>
              Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
          </div>
        )}
      </div>

      <div style={{ padding: "12px 20px 20px" }}>
        {stage === "identify" && (
          <button disabled={!canSendCode} onClick={() => setStage("reset")}
            style={{ width: "100%", padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: canSendCode ? AMBER : "#D8D0BF" }}>
            Enviar código
          </button>
        )}
        {stage === "reset" && (
          <button disabled={!canReset} onClick={handleConfirmReset}
            style={{ width: "100%", padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: canReset ? AMBER : "#D8D0BF" }}>
            Restablecer contraseña
          </button>
        )}
        {stage === "done" && (
          <button onClick={onBack}
            style={{ width: "100%", padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: AMBER }}>
            Volver a iniciar sesión
          </button>
        )}
      </div>
    </div>
  );
}

          <p style={{ fontSize: 10.5, color: RED, marginTop: -6, marginBottom: 14 }}>Los correos no coinciden.</p>

        <AuthField label="Número de teléfono" Icon={IconPhone} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="300 123 4567" />

        <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 8 }}>¿Cómo quieres verificar tu cuenta?</p>

                padding: "11px 0", borderRadius: 14, fontSize: 12, fontWeight: 600,
                backgroundColor: verifyMethod === m.id ? AMBER : "#fff",
                color: verifyMethod === m.id ? "#fff" : INK
              }}>

              {m.label}
            </button>
          ))}
        </div>

        <AuthField label="Código de verificación" Icon={IconShield} value={code} onChange={(e) => setCode(e.target.value)}
          placeholder={verifyMethod === "correo" ? "Código enviado a tu correo" : "Código enviado por SMS"} />
      </div>
      <div style={{ padding: "12px 20px 20px" }}>
        <button
          disabled={!canSubmit}
          onClick={() => onRegister({
            fullName, username, password, userType,
            providerSubtype: isProvider ? providerSubtype : null,
            companyName: isCompany ? companyName : null,
            birthDate: `${birthYear}-${String(birthMonth).padStart(2, "0")}-${String(birthDay).padStart(2, "0")}`,
            email, phone, verifyMethod,
          })}
          style={{
            width: "100%", padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600,
            backgroundColor: canSubmit ? AMBER : "#D8D0BF"
          }}>
          Crear cuenta
        </button>
      </div>
    </div>
  );
}

const PROVIDER_ONBOARDING_STEPS = ["Verifica tus datos", "Selecciona tus categorías", "Días y horarios disponibles", "Cuéntanos más de ti", "Agrega tus servicios", "Cuenta para pagos"];
const WEEK_DAYS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const ACCOUNT_TYPES = [
  { id: "ahorros", label: "Ahorros" },
  { id: "corriente", label: "Corriente" },
];

function ScreenOnboarding({ user, onComplete }) {
  const isProvider = user.userType === "prestador";
  return isProvider
    ? <ProviderOnboarding user={user} onComplete={onComplete} />
    : <ClientOnboarding user={user} onComplete={onComplete} />;
}

const CLIENT_ONBOARDING_STEPS = ["Verifica tus datos", "Dirección y pago"];

function ClientOnboarding({ user, onComplete }) {
  const [step, setStep] = useState(0);

  // step 0 — datos personales del perfil
  const [profilePhoto, setProfilePhoto] = useState(0);
  const [fullName, setFullName] = useState(user.fullName || "");
  const [bio, setBio] = useState("");

  // step 1 — dirección y pago
  const [address, setAddress] = useState("");
  const [paymentPref, setPaymentPref] = useState("efectivo");
  const [cardNumber, setCardNumber] = useState("");
  const [cardExpiry, setCardExpiry] = useState("");
  const [cardCvv, setCardCvv] = useState("");
  const [cardName, setCardName] = useState("");

  const stepValid = [
    fullName.trim() !== "" && profilePhoto > 0,
    address.trim() !== "" && (paymentPref !== "tarjeta" || (cardNumber.trim() !== "" && cardExpiry.trim() !== "" && cardCvv.trim() !== "" && cardName.trim() !== "")),
  ][step];

  const isLast = step === CLIENT_ONBOARDING_STEPS.length - 1;

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ padding: "28px 24px 16px", textAlign: "center" }}>
        <div style={{ width: 46, height: 46, borderRadius: 14, backgroundColor: INK, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 10px" }}>
          <IconCheck size={20} color={AMBER} />
        </div>
        <h1 style={{ fontSize: 17, fontWeight: 700, color: INK }}>Primeros pasos en TORY</h1>
        <p style={{ fontSize: 12, fontWeight: 600, color: AMBER, marginTop: 6 }}>{CLIENT_ONBOARDING_STEPS[step]}</p>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 10 }}>
          {CLIENT_ONBOARDING_STEPS.map((s, i) => (
            <div key={s} style={{ width: i === step ? 18 : 6, height: 6, borderRadius: 999, backgroundColor: i <= step ? AMBER : "#E3DCCE", transition: "width .2s" }} />
          ))}
        </div>
      </div>

      <div style={{ padding: "0 20px", flex: 1, minHeight: 0, overflowY: "auto" }}>
        {step === 0 && (
          <>
            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 8 }}>Foto de perfil</p>
            {profilePhoto === 0 ? (
              <button onClick={() => setProfilePhoto(1)}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, borderRadius: 14, padding: 13, backgroundColor: "#fff", marginBottom: 16, textAlign: "left" }}>
                <div style={{ width: 32, height: 32, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "#EFE2D2", flexShrink: 0 }}>
                  <IconCamera size={15} color={AMBER} />
                </div>
                <span style={{ fontSize: 12.5, fontWeight: 600, color: INK }}>Agregar foto de perfil</span>
              </button>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <div style={{ width: 44, height: 44, borderRadius: 999, backgroundColor: INK, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <span style={{ color: "#fff", fontSize: 13, fontWeight: 700 }}>{(fullName || "C").charAt(0)}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <IconCheck size={13} color={GREEN} />

                </div>
              </div>

            <AuthField label="Nombre completo" Icon={IconUser} value={fullName} onChange={(e) => setFullName(e.target.value)} placeholder="Ej: María Torres" />

            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>Descripción breve personal</p>
            <div style={{ borderRadius: 14, padding: 14, backgroundColor: "#fff", marginBottom: 20 }}>

            </div>
          </>
        )}

        {step === 1 && (
          <>
            <AuthField label="Dirección principal" Icon={IconMapPin} value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Calle, número, barrio, ciudad" />

            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 8 }}>Método de pago preferido</p>

              {PAYMENT_METHODS.map((m) => (

                  style={{

                    backgroundColor: paymentPref === m.id ? AMBER : "#fff",
                    color: paymentPref === m.id ? "#fff" : INK
                  }}>
                  <m.Icon size={14} color={paymentPref === m.id ? "#fff" : "#A6A08F"} />
                  {m.id === "tarjeta" ? "Tarjeta" : "Efectivo"}
                </button>
              ))}
            </div>

            {paymentPref === "tarjeta" && (
              <div className="fade-in">
                <AuthField label="Número de tarjeta" Icon={IconCard} value={cardNumber}

                      <input
                        value={cardExpiry} maxLength={5} inputMode="numeric"
                        onChange={(e) => {
                          const digits = e.target.value.replace(/[^0-9]/g, "").slice(0, 4);
                          const formatted = digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
                          setCardExpiry(formatted);

                        placeholder="MM/AA"
                        style={{ width: "100%", minWidth: 0, border: "none", outline: "none", fontSize: 13, color: INK, backgroundColor: "transparent" }} />
                    </div>
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>CVV</p>
                    <div style={{ borderRadius: 14, padding: "12px 10px", backgroundColor: "#fff" }}>
                      <input
                        value={cardCvv} maxLength={3} inputMode="numeric"
                        onChange={(e) => setCardCvv(e.target.value.replace(/[^0-9]/g, "").slice(0, 3))}
                        placeholder="123"
                        style={{ width: "100%", minWidth: 0, border: "none", outline: "none", fontSize: 13, color: INK, backgroundColor: "transparent" }} />
                    </div>
                  </div>
                </div>
                <AuthField label="Nombre en la tarjeta" Icon={IconUser} value={cardName}
                  onChange={(e) => setCardName(e.target.value)} placeholder="Como aparece en la tarjeta" />
              </div>
            )}
          </>
        )}
      </div>

      <div style={{ padding: "12px 20px 20px", display: "flex", gap: 10 }}>
        {step > 0 && (
          <button onClick={() => setStep((s) => s - 1)}
            style={{ padding: "14px 20px", borderRadius: 16, fontSize: 14, fontWeight: 600, backgroundColor: "#fff", color: INK }}>
            Atrás
          </button>
        )}
        <button
          disabled={!stepValid}
          onClick={() => isLast ? onComplete() : setStep((s) => s + 1)}
          style={{ flex: 1, padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: stepValid ? AMBER : "#D8D0BF" }}>
          {isLast ? "Finalizar y comenzar" : "Continuar"}
        </button>
      </div>
    </div>
  );
}

function ProviderOnboarding({ user, onComplete }) {
  const [step, setStep] = useState(0);

  // step 0 — verificación de datos
  const [profilePhoto, setProfilePhoto] = useState(0);

  const [companyPhone, setCompanyPhone] = useState("");
  const [localAddress, setLocalAddress] = useState("");
  const [taxDoc, setTaxDoc] = useState(0);

  // step 1 — categorías
  const [catQuery, setCatQuery] = useState("");
  const [selectedCats, setSelectedCats] = useState([]);
  const toggleCat = (id) => setSelectedCats((cs) => cs.includes(id) ? cs.filter((x) => x !== id) : [...cs, id]);
  const filteredCats = CATEGORIES.filter((c) => c.label.toLowerCase().includes(catQuery.toLowerCase()));

  // step 2 — días y horarios
  const [selectedDays, setSelectedDays] = useState([]);
  const [selectedTimes, setSelectedTimes] = useState([]);
  const toggleDay = (d) => setSelectedDays((ds) => ds.includes(d) ? ds.filter((x) => x !== d) : [...ds, d]);
  const toggleTime = (t) => setSelectedTimes((ts) => ts.includes(t) ? ts.filter((x) => x !== t) : [...ts, t]);

  // step 3 — cuéntanos más de ti
  const [bio, setBio] = useState("");
  const [projects, setProjects] = useState([{ id: 1, title: "", description: "", photos: 0 }]);
  const addProject = () => setProjects((ps) => [...ps, { id: Date.now(), title: "", description: "", photos: 0 }]);
  const updateProject = (id, field, value) => setProjects((ps) => ps.map((p) => p.id === id ? { ...p, [field]: value } : p));
  const addProjectPhoto = (id) => setProjects((ps) => ps.map((p) => p.id === id ? { ...p, photos: Math.min(p.photos + 1, 3) } : p));

  // step 4 — servicios por categoría
  const [categoryServices, setCategoryServices] = useState({});
  useEffect(() => {
    setCategoryServices((prev) => {
      const next = {};
      selectedCats.forEach((id) => {
        next[id] = (prev[id] && prev[id].length) ? prev[id] : [{ id: Date.now() + Math.random(), type: "", priceFrom: "", priceTo: "" }];
      });
      return next;
    });
  }, [selectedCats]);
  const addService = (catId) => setCategoryServices((cs) => ({
    ...cs, [catId]: [...(cs[catId] || []), { id: Date.now() + Math.random(), type: "", priceFrom: "", priceTo: "" }],
  }));
  const updateService = (catId, serviceId, field, value) => setCategoryServices((cs) => ({
    ...cs, [catId]: (cs[catId] || []).map((s) => s.id === serviceId ? { ...s, [field]: value } : s),

  // step 5 — cuenta bancaria
  const [bank, setBank] = useState("");
  const [accountNumber, setAccountNumber] = useState("");
  const [holder, setHolder] = useState(user.fullName || "");

  const stepValid = [
    fullName.trim() !== "" && profilePhoto > 0

      && localAddress.trim() !== "" && taxDoc > 0,
    selectedCats.length > 0,
    selectedDays.length > 0 && selectedTimes.length > 0,
    bio.trim() !== "",
    selectedCats.every((id) => (categoryServices[id] || []).some((s) => s.type.trim() !== "" && s.priceFrom.trim() !== "" && s.priceTo.trim() !== "")),
    bank.trim() !== "" && accountNumber.trim() !== "" && holder.trim() !== "",
  ][step];

  const isLast = step === PROVIDER_ONBOARDING_STEPS.length - 1;

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      <div style={{ padding: "28px 24px 16px", textAlign: "center" }}>
        <div style={{ width: 46, height: 46, borderRadius: 14, backgroundColor: INK, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 10px" }}>
          <IconCheck size={20} color={AMBER} />

        <h1 style={{ fontSize: 17, fontWeight: 700, color: INK }}>Primeros pasos en TORY</h1>
        <p style={{ fontSize: 12, fontWeight: 600, color: AMBER, marginTop: 6 }}>{PROVIDER_ONBOARDING_STEPS[step]}</p>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 10 }}>
          {PROVIDER_ONBOARDING_STEPS.map((s, i) => (
            <div key={s} style={{ width: i === step ? 18 : 6, height: 6, borderRadius: 999, backgroundColor: i <= step ? AMBER : "#E3DCCE", transition: "width .2s" }} />
          ))}
        </div>

      <div style={{ padding: "0 20px", flex: 1, minHeight: 0, overflowY: "auto" }}>

                    <div style={{
                      width: 18, height: 18, borderRadius: 999, flexShrink: 0,
                      border: checked ? `5px solid ${AMBER}` : "2px solid #D8D0BF"
                    }} />
                  </button>
                );
              })}
            </div>
          </>
        )}

        {step === 2 && (
          <>
            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 8 }}>¿Qué días trabajas?</p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
              {WEEK_DAYS.map((d) => (
                <button key={d} onClick={() => toggleDay(d)}
                  style={{
                    width: 44, padding: "10px 0", borderRadius: 12, fontSize: 12, fontWeight: 700, textAlign: "center",
                    backgroundColor: selectedDays.includes(d) ? AMBER : "#fff",
                    color: selectedDays.includes(d) ? "#fff" : INK
                  }}>
                  {d}
                </button>
              ))}
            </div>

            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 8 }}>¿En qué horarios atiendes?</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginBottom: 20 }}>
              {TIME_SLOTS.map((t) => (
                <button key={t} onClick={() => toggleTime(t)}
                  style={{
                    padding: "10px 0", borderRadius: 12, textAlign: "center", fontSize: 12, fontWeight: 600,
                    backgroundColor: selectedTimes.includes(t) ? AMBER : "#fff",
                    color: selectedTimes.includes(t) ? "#fff" : INK
                  }}>
                  {t}
                </button>
              ))}
            </div>
          </>
        )}

        {step === 3 && (
          <>
            <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>Descripción breve</p>
            <p style={{ fontSize: 10.5, color: "#8C9591", marginBottom: 8, lineHeight: 1.4 }}>
              Esto se mostrará en tu perfil para que los clientes te conozcan.
            </p>
            <div style={{ borderRadius: 14, padding: 14, backgroundColor: "#fff", marginBottom: 22 }}>
              <textarea value={bio} onChange={(e) => setBio(e.target.value)} rows={3}
                placeholder="Ej: Técnico certificado con 8 años de experiencia en plomería residencial..."
                style={{ width: "100%", border: "none", outline: "none", resize: "none", fontSize: 12.5, color: INK, backgroundColor: "transparent", fontFamily: "inherit", lineHeight: 1.5 }} />
            </div>

            <p style={{ fontSize: 12, fontWeight: 700, color: INK, marginBottom: 4 }}>Proyectos</p>
            <p style={{ fontSize: 10.5, color: "#8C9591", marginBottom: 14, lineHeight: 1.4 }}>
              Muestra trabajos anteriores para generar confianza (opcional).
            </p>

            <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 14 }}>
              {projects.map((proj, i) => (
                <div key={proj.id} style={{ borderRadius: 16, padding: 14, backgroundColor: "#fff" }}>
                  <p style={{ fontSize: 11, fontWeight: 700, color: AMBER, marginBottom: 10 }}>Proyecto {i + 1}</p>
                  <AuthField label="Título" Icon={IconEdit} value={proj.title}
                    onChange={(e) => updateProject(proj.id, "title", e.target.value)} placeholder="Ej: Reparación de tubería" />
                  <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>Descripción breve</p>
                  <div style={{ borderRadius: 14, padding: 12, backgroundColor: CREAM, marginBottom: 12 }}>
                    <textarea value={proj.description} onChange={(e) => updateProject(proj.id, "description", e.target.value)} rows={2}
                      placeholder="Cuenta brevemente en qué consistió el trabajo..."
                      style={{ width: "100%", border: "none", outline: "none", resize: "none", fontSize: 12, color: INK, backgroundColor: "transparent", fontFamily: "inherit", lineHeight: 1.5 }} />
                  </div>
                  {proj.photos === 0 ? (
                    <button onClick={() => addProjectPhoto(proj.id)}
                      style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, borderRadius: 14, padding: 12, backgroundColor: CREAM, textAlign: "left" }}>
                      <div style={{ width: 30, height: 30, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: "#EFE2D2", flexShrink: 0 }}>
                        <IconCamera size={14} color={AMBER} />
                      </div>
                      <span style={{ fontSize: 12, fontWeight: 600, color: INK }}>Agregar fotos</span>
                    </button>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      {Array.from({ length: proj.photos }).map((_, pi) => (
                        <div key={pi} style={{ width: 44, height: 44, borderRadius: 10, backgroundColor: "#DCE6DD", display: "flex", alignItems: "center", justifyContent: "center" }}>
                          <IconImage size={16} color="#7C9484" />
                        </div>
                      ))}
                      {proj.photos < 3 && (
                        <button onClick={() => addProjectPhoto(proj.id)}
                          style={{ width: 44, height: 44, borderRadius: 10, backgroundColor: CREAM, display: "flex", alignItems: "center", justifyContent: "center" }}>
                          <IconCamera size={14} color={AMBER} />
                        </button>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>

            <button onClick={addProject}
              style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, borderRadius: 14, padding: 13, backgroundColor: "#fff", marginBottom: 20 }}>
              <div style={{ width: 22, height: 22, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: AMBER }}>
                <span style={{ color: "#fff", fontSize: 14, fontWeight: 700, lineHeight: 1 }}>+</span>
              </div>
              <span style={{ fontSize: 12.5, fontWeight: 600, color: INK }}>Agregar otro proyecto</span>
            </button>
          </>
        )}

        {step === 4 && (
          <>
            <p style={{ fontSize: 10.5, color: "#8C9591", marginBottom: 16, lineHeight: 1.4 }}>
              Define los servicios que ofreces dentro de cada categoría y su precio aproximado.
            </p>

            <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 8 }}>
              {selectedCats.map((catId) => {
                const cat = CATEGORIES.find((c) => c.id === catId);
                const services = categoryServices[catId] || [];
                return (
                  <div key={catId} style={{ borderRadius: 16, padding: 14, backgroundColor: "#fff" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                      {cat && <cat.Icon size={16} color={AMBER} />}
                      <p style={{ fontSize: 13, fontWeight: 700, color: INK }}>{cat ? cat.label : catId}</p>
                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {services.map((s, i) => (
                        <div key={s.id} style={{ borderRadius: 14, padding: 12, backgroundColor: CREAM }}>
                          {services.length > 1 && (
                            <p style={{ fontSize: 10.5, fontWeight: 700, color: AMBER, marginBottom: 8 }}>Servicio {i + 1}</p>
                          )}
                          <AuthField label="Tipo de servicio" Icon={IconEdit} value={s.type}
                            onChange={(e) => updateService(catId, s.id, "type", e.target.value)} placeholder="Ej: Reparación de fugas" />
                          <p style={{ fontSize: 11.5, fontWeight: 600, color: INK, marginBottom: 6 }}>Precio aproximado</p>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ fontSize: 11.5, color: "#6B7A75" }}>de $</span>
                            <div style={{ flex: 1, minWidth: 0, borderRadius: 12, padding: "10px 10px", backgroundColor: "#fff" }}>
                              <input value={s.priceFrom} inputMode="numeric"
                                onChange={(e) => updateService(catId, s.id, "priceFrom", e.target.value.replace(/[^0-9]/g, ""))}
                                placeholder="150" style={{ width: "100%", minWidth: 0, border: "none", outline: "none", fontSize: 12.5, color: INK, backgroundColor: "transparent" }} />
                            </div>
                            <span style={{ fontSize: 11.5, color: "#6B7A75" }}>a $</span>
                            <div style={{ flex: 1, minWidth: 0, borderRadius: 12, padding: "10px 10px", backgroundColor: "#fff" }}>
                              <input value={s.priceTo} inputMode="numeric"
                                onChange={(e) => updateService(catId, s.id, "priceTo", e.target.value.replace(/[^0-9]/g, ""))}
                                placeholder="220" style={{ width: "100%", minWidth: 0, border: "none", outline: "none", fontSize: 12.5, color: INK, backgroundColor: "transparent" }} />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <button onClick={() => addService(catId)}
                      style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, borderRadius: 12, padding: 11, backgroundColor: CREAM, marginTop: 12 }}>
                      <div style={{ width: 18, height: 18, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: AMBER }}>
                        <span style={{ color: "#fff", fontSize: 12, fontWeight: 700, lineHeight: 1 }}>+</span>
                      </div>
                      <span style={{ fontSize: 11.5, fontWeight: 600, color: INK }}>Agregar otro servicio</span>
                    </button>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {step === 5 && (
          <>
            <p style={{ fontSize: 11.5, color: "#6B7A75", lineHeight: 1.5, marginBottom: 16 }}>
              Agrega una cuenta para recibir los depósitos de tus pagos cobrados con tarjeta.
            </p>
            <AuthField label="Titular de la cuenta" Icon={IconUser} value={holder} onChange={(e) => setHolder(e.target.value)} placeholder="Nombre como aparece en el banco" />
            <AuthField label="Banco" Icon={IconBox} value={bank} onChange={(e) => setBank(e.target.value)} placeholder="Ej: Bancolombia" />
            <AuthField label="Número de cuenta" Icon={IconDollar} value={accountNumber} onChange={(e) => setAccountNumber(e.target.value)} placeholder="Ej: 001234567890" />
          </>
        )}
      </div>

      <div style={{ padding: "12px 20px 20px", display: "flex", gap: 10 }}>
        {step > 0 && (
          <button onClick={() => setStep((s) => s - 1)}
            style={{ padding: "14px 20px", borderRadius: 16, fontSize: 14, fontWeight: 600, backgroundColor: "#fff", color: INK }}>
            Atrás
          </button>
        )}
        <button
          disabled={!stepValid}
          onClick={() => isLast ? onComplete() : setStep((s) => s + 1)}
          style={{ flex: 1, padding: "14px 0", borderRadius: 16, color: "#fff", fontSize: 14, fontWeight: 600, backgroundColor: stepValid ? AMBER : "#D8D0BF" }}>
          {isLast ? "Finalizar y comenzar" : "Continuar"}
        </button>
      </div>
    </div>
  );
}

};

  verifyMethod: "correo", hasOnboarded: false,
};

const DEMO_PROVIDER_PERSONAL = {

  userType: "prestador", providerSubtype: "personal", email: "prestador@tory.demo", phone: "300 222 2222",

};

const DEMO_PROVIDER_EMPRESA = {

  userType: "prestador", providerSubtype: "empresa", companyName: "Empresa Demo SAS",

};

function ScreenOnboardingSuccess({ onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 3000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="fade-in" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 32px" }}>
      <div style={{ position: "relative", width: 88, height: 88, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 22 }}>
        <div className="pulse" style={{ position: "absolute", inset: 0, borderRadius: 999, backgroundColor: "#EFE2D2" }} />
        <div style={{ width: 60, height: 60, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", backgroundColor: INK }}>
          <IconCheck size={26} color={AMBER} />
        </div>
      </div>
      <p style={{ fontSize: 17, fontWeight: 700, color: INK, textAlign: "center", marginBottom: 8 }}>
        ¡Registro completado!
      </p>
      <p style={{ fontSize: 13, color: "#6B7A75", textAlign: "center", lineHeight: 1.5 }}>
        Ya puedes comenzar a usar TORY.
      </p>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState("cliente"); // cliente | prestador
  const [session, setSession] = useState(null);
  const [authView, setAuthView] = useState("login"); // login | register
  const [registeredUsers, setRegisteredUsers] = useState([
    DEFAULT_DEMO_USER, DEMO_CLIENT_USER, DEMO_PROVIDER_PERSONAL, DEMO_PROVIDER_EMPRESA,
  ]);
  const [loginError, setLoginError] = useState("");
  const [justRegistered, setJustRegistered] = useState(false);
  const [needsOnboarding, setNeedsOnboarding] = useState(false);
  const [onboardingSuccess, setOnboardingSuccess] = useState(false);

  const handleRegister = (userData) => {
    setRegisteredUsers((us) => [...us, { ...userData, hasOnboarded: false }]);
    setJustRegistered(true);
    setAuthView("login");
  };

  const handleLogin = (username, password) => {
    const found = registeredUsers.find((u) => u.username === username && u.password === password);
    if (found) {
      setSession(found);
      setMode(found.userType);
      setLoginError("");
      setNeedsOnboarding(!found.hasOnboarded);
    } else {
      setLoginError("Usuario o contraseña incorrectos.");
    }
  };

  const handleLogout = () => {
    setSession(null);
    setAuthView("login");
    setLoginError("");
    setJustRegistered(false);
    setNeedsOnboarding(false);
    setOnboardingSuccess(false);
  };

  const completeOnboarding = () => {
    setRegisteredUsers((us) => us.map((u) => u.username === session.username ? { ...u, hasOnboarded: true } : u));
    setSession((s) => ({ ...s, hasOnboarded: true }));
    setOnboardingSuccess(true);
  };

  const finishOnboardingSuccess = () => {
    setOnboardingSuccess(false);
    setNeedsOnboarding(false);
  };

  const handleResetPassword = (username, newPassword) => {
    const exists = registeredUsers.some((u) => u.username === username);
    if (!exists) return false;
    setRegisteredUsers((us) => us.map((u) => u.username === username ? { ...u, password: newPassword } : u));
    return true;
  };

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 16px", backgroundColor: "#EDE7DA" }}>
      {session && !needsOnboarding && !onboardingSuccess && (
        <div style={{ display: "flex", gap: 6, marginBottom: 18, backgroundColor: "#E3DCCE", padding: 4, borderRadius: 999 }}>
          {[{ k: "cliente", l: "Flujo cliente" }, { k: "prestador", l: "Flujo prestador" }].map((o) => (
            <button key={o.k} onClick={() => setMode(o.k)}
              style={{
                padding: "8px 18px", borderRadius: 999, fontSize: 12, fontWeight: 600,
                backgroundColor: mode === o.k ? INK : "transparent",
                color: mode === o.k ? "#fff" : "#6B7A75"
              }}>
              {o.l}
            </button>
          ))}
        </div>
      )}

      <PhoneChrome key={session ? (onboardingSuccess ? "success" : needsOnboarding ? "onboarding" : mode) : authView}>
        {!session ? (
          authView === "login" ? (
            <ScreenLogin onLogin={handleLogin}
              onGoRegister={() => { setAuthView("register"); setJustRegistered(false); }}
              onGoForgot={() => { setAuthView("forgot"); setLoginError(""); }}
              error={loginError} justRegistered={justRegistered} />
          ) : authView === "register" ? (
            <ScreenRegister onBack={() => setAuthView("login")} onRegister={handleRegister} />
          ) : (
            <ScreenForgotPassword onBack={() => setAuthView("login")} onReset={handleResetPassword} />
          )
        ) : onboardingSuccess ? (
          <ScreenOnboardingSuccess onDone={finishOnboardingSuccess} />
        ) : needsOnboarding ? (
          <ScreenOnboarding user={session} onComplete={completeOnboarding} />
        ) : (
          mode === "cliente" ? <ClientApp onLogout={handleLogout} /> : <ProviderApp onLogout={handleLogout} />
        )}
      </PhoneChrome>

      <p style={{ fontSize: 11, color: "#8C8267", marginTop: 20, textAlign: "center", maxWidth: 260 }}>
        {!session
          ? "Regístrate y luego inicia sesión con tu usuario y contraseña."
          : onboardingSuccess
            ? "Estamos preparando tu cuenta..."
            : needsOnboarding
              ? "Completa estos pasos iniciales para configurar tu cuenta."
              : mode === "cliente"
                ? "Usa la barra inferior para moverte entre Inicio, Servicios y Perfil."
                : "Activa \"en línea\" en el panel para ver las solicitudes de clientes cercanos."}
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
